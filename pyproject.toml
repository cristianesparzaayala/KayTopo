[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaytopo"
version = "0.1.2a0"
description = "Offline topographic coordinate conversion and CAD preparation tool"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Cristian Esparza Ayala"}]
dependencies = [
  "PySide6>=6.7",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "ezdxf>=1.3",
  "shapely>=2.0",
  "numpy>=1.26",
]

[project.scripts]
kaytopo = "kaytopo.app:run"

[tool.setuptools.packages.find]
include = ["kaytopo*"]
