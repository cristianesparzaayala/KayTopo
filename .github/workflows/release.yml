name: KayTopo Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$') {
            throw "Tag must look like v1.2.3 or v1.2.3-alpha."
          }
          $versionInfo = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION_INFO=$versionInfo" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable executable
        run: pyinstaller --noconfirm --clean KayTopo.spec

      - name: Smoke-test portable executable
        shell: pwsh
        run: |
          $env:KAYTOPO_SMOKE_TEST = "1"
          $p = Start-Process -FilePath "dist/KayTopo.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Portable smoke test failed with exit code $($p.ExitCode)."
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          ISCC.exe "/DMyAppVersion=$env:APP_VERSION" "/DMyVersionInfo=$env:VERSION_INFO" "installer/KayTopo.iss"
          $setup = "dist/KayTopo_Setup_v$env:APP_VERSION.exe"
          if (-not (Test-Path $setup)) {
            throw "Installer was not generated: $setup"
          }

      - name: Smoke-test installer lifecycle
        shell: pwsh
        run: |
          $setup = Resolve-Path "dist/KayTopo_Setup_v$env:APP_VERSION.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/TASKS=" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Installer failed with exit code $($p.ExitCode)."
          }

          $installed = Join-Path $env:LOCALAPPDATA "Programs\KayTopo\KayTopo.exe"
          if (-not (Test-Path $installed)) {
            throw "Installed KayTopo.exe was not found."
          }

          $env:KAYTOPO_SMOKE_TEST = "1"
          $p = Start-Process -FilePath $installed -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Installed smoke test failed with exit code $($p.ExitCode)."
          }

          $uninstaller = Join-Path $env:LOCALAPPDATA "Programs\KayTopo\unins000.exe"
          $p = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($p.ExitCode)."
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item "dist/KayTopo.exe" "dist/KayTopo_Portable_v$env:APP_VERSION.exe"
          Compress-Archive -Path "docs","examples","README.md","LICENSE" -DestinationPath "dist/KayTopo_Documentacion_v$env:APP_VERSION.zip" -Force

          $assetPaths = @(
            "dist/KayTopo_Setup_v$env:APP_VERSION.exe",
            "dist/KayTopo_Portable_v$env:APP_VERSION.exe",
            "dist/KayTopo_Documentacion_v$env:APP_VERSION.zip"
          )
          $hashLines = foreach ($path in $assetPaths) {
            $file = Get-Item $path
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $hashLines | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            "dist/KayTopo_Setup_v$env:APP_VERSION.exe",
            "dist/KayTopo_Portable_v$env:APP_VERSION.exe",
            "dist/KayTopo_Documentacion_v$env:APP_VERSION.zip",
            "dist/SHA256SUMS.txt"
          )

          $args = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "--title", "KayTopo $env:APP_VERSION",
            "--generate-notes"
          )
          if ($env:APP_VERSION -match "-(alpha|beta|rc)") {
            $args += "--prerelease"
          }
          $args += $assets
          gh @args
